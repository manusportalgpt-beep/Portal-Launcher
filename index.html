<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Portal Launcher</title>
    <style>
      /* Тёмный фон по умолчанию — лаунчер тёмный до применения темы,
         никаких белых вспышек на светлых ОС. Светлая тема применяется
         только после применения темы скриптом (data-theme="light"). */
      html, body { background: #0D1117; color: #E6EDF3; margin: 0; }
      @media (prefers-color-scheme: light) {
        html[data-theme="light"] body { background: #FFFFFF; color: #1A1F26; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
